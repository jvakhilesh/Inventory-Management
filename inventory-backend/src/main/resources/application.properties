spring.config.import=optional:file:.env[.properties]
spring.application.name=inventory-management
server.port=${SERVER_PORT:8081}

# Set DB_URL, DB_USER and DB_PASS in your environment before starting the application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_management}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SMTP values are supplied through environment variables. Never commit credentials.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Automatic stock alerts run every five minutes. Alerts are skipped until a recipient is configured.
inventory.stock-alert.enabled=${STOCK_ALERT_ENABLED:true}
inventory.stock-alert.recipient=${STOCK_ALERT_RECIPIENT:}
inventory.stock-alert.fixed-rate-ms=${STOCK_ALERT_FIXED_RATE_MS:300000}
inventory.stock-alert.initial-delay-ms=${STOCK_ALERT_INITIAL_DELAY_MS:30000}

jwt.secretKey=${JWT_SECRET_KEY}
